services:
  db:
    # Postgres 16 + pgvector pre-installed (migration 061 requires
    # the `vector` extension for material embeddings).
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-hub}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-data_hub}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./data/seed:/seed:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-hub} -d ${POSTGRES_DB:-data_hub}"]
      interval: 5s
      timeout: 3s
      retries: 20

  app:
    build:
      context: .
      args:
        VERSION: ${DATA_HUB_VERSION:-0.0.0}
        GIT_SHA: ${DATA_HUB_GIT_SHA:-unknown}
        BUILD_TIME: ${DATA_HUB_BUILD_TIME:-unknown}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATA_HUB_DATABASE_URL: postgresql://${POSTGRES_USER:-hub}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-data_hub}
      DATA_HUB_SEED_EMAIL: ${DATA_HUB_SEED_EMAIL:-admin@data-hub.local}
      DATA_HUB_SEED_PASSWORD: ${DATA_HUB_SEED_PASSWORD:?DATA_HUB_SEED_PASSWORD is required}
      DATA_HUB_AUTO_SEED_DEMO: "0"
      DATA_HUB_KEYS_DIR: /var/lib/data-hub/keys
      DATA_HUB_FILES_ROOT: /var/lib/data-hub/files
      DATA_HUB_API_AUTH_DISABLED: ${DATA_HUB_API_AUTH_DISABLED:-0}
      DATA_HUB_SSO_ALLOWED_REDIRECT_ORIGINS: ${DATA_HUB_SSO_ALLOWED_REDIRECT_ORIGINS:-}
      DATA_HUB_FORCE_HTTPS_COOKIE: ${DATA_HUB_FORCE_HTTPS_COOKIE:-0}
    ports:
      - "${APP_BIND:-0.0.0.0}:8754:8754"
    volumes:
      - appfiles:/var/lib/data-hub/files
      - appkeys:/var/lib/data-hub/keys
    networks:
      # default: reach `db` (project-local). tinsu-shared: let sister apps
      # (CO) call this API server-to-server by the alias `data-hub-app`
      # instead of round-tripping out to the public domain. JWT `iss` is
      # unaffected — CO keeps DATA_HUB_ISSUER_URL/JWKS pointed at the public
      # URL; only the call path moves onto the internal bridge.
      default: {}
      tinsu-shared:
        aliases:
          - data-hub-app

volumes:
  pgdata:
  appfiles:
  appkeys:

networks:
  # Cross-project bridge shared with the CO compose project. Created out of
  # band (`docker network create tinsu-shared`); external so neither project
  # owns/destroys it.
  tinsu-shared:
    external: true
