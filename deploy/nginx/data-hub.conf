# nginx reverse proxy for Data Hub.
# - TLS termination (Let's Encrypt)
# - HTTP→HTTPS redirect
# - reasonable client_max_body_size for the Excel uploads (some BCCT
#   files are 50+ MB; default 1m would reject them)
# - websocket-friendly upgrade pass-through (in case the chat agent
#   gets streaming later)

# HTTP → HTTPS redirect
server {
    listen 80;
    listen [::]:80;
    server_name data-hub.example;
    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS app
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name data-hub.example;

    ssl_certificate     /etc/letsencrypt/live/data-hub.example/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/data-hub.example/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;

    # BCCT files can be large. Cap at 200 MB; tighten if you don't
    # ingest the Growatt-style 51 MB consolidated workbooks.
    client_max_body_size 200m;
    client_body_timeout  120s;

    # Headers
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # Strict-Transport-Security only after you're confident HTTPS works:
    # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Static files served directly (cache 1 day; Data Hub fingerprints
    # via filename for invalidation)
    location /static/ {
        alias /opt/data-hub/app/static/;
        expires 1d;
        access_log off;
    }

    # Everything else → uvicorn
    location / {
        proxy_pass http://127.0.0.1:8754;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Websocket upgrade (chat agent streaming, future)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Long-running requests (BCCT preview-confirm on big workbooks,
        # LLM agent turns).
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }
}
