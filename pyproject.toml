[project]
name = "data-hub"
version = "0.18.0"
description = "Data Hub — agency master records management (Tinsu AI)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "jinja2>=3.1",
    "openpyxl>=3.1",
    "psycopg[binary]>=3.2",
    "psycopg-pool>=3.2",
    "python-multipart>=0.0.18",
    "uvicorn[standard]>=0.34",
    "xlrd>=2.0",
    "argon2-cffi>=23.0",
    "itsdangerous>=2.2",
    "httpx>=0.28.1",
    "openai>=2.33.0",
    "pyjwt[crypto]>=2.10",
    "pyyaml>=6.0.3",
    "google-re2>=1.1.20251105",
    "pypdf>=5.1",
]

[dependency-groups]
dev = [
    "httpx>=0.28",
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "playwright>=1.49",
    "xlwt>=1.3.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
pythonpath = ["."]
asyncio_mode = "auto"
