<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Barry CO Interactive Demo</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f6f7f2;
      --bg-strong: #eef2eb;
      --surface: #ffffff;
      --surface-2: #f9faf7;
      --ink: #162019;
      --muted: #667368;
      --line: #dce3dc;
      --line-strong: #c8d3ca;
      --accent: #147a5c;
      --accent-ink: #ffffff;
      --blue: #2759a5;
      --amber: #a9660a;
      --red: #b33a30;
      --shadow: 0 18px 50px rgba(27, 38, 31, 0.08);
      --radius: 8px;
      --mono: "SFMono-Regular", Consolas, "Liberation Mono", monospace;
      --sans: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    body[data-theme="dark"] {
      color-scheme: dark;
      --bg: #111511;
      --bg-strong: #171d18;
      --surface: #1b211d;
      --surface-2: #151a16;
      --ink: #eef3ed;
      --muted: #a8b4aa;
      --line: #303a33;
      --line-strong: #435047;
      --accent: #62c6a4;
      --accent-ink: #0c1b15;
      --blue: #8eb6ff;
      --amber: #e0ac5a;
      --red: #f07e72;
      --shadow: 0 18px 50px rgba(0, 0, 0, 0.28);
    }

    * {
      box-sizing: border-box;
    }

    html {
      min-height: 100%;
      scroll-behavior: smooth;
    }

    body {
      min-height: 100%;
      margin: 0;
      color: var(--ink);
      background:
        linear-gradient(90deg, rgba(20, 122, 92, 0.035) 1px, transparent 1px),
        linear-gradient(rgba(39, 89, 165, 0.035) 1px, transparent 1px),
        var(--bg);
      background-size: 28px 28px;
      font-family: var(--sans);
      font-size: 14px;
      line-height: 1.45;
    }

    a,
    button,
    input,
    select,
    textarea {
      font: inherit;
    }

    button,
    select,
    input,
    textarea {
      color: inherit;
    }

    button {
      cursor: pointer;
    }

    .topnav {
      position: sticky;
      top: 0;
      z-index: 50;
      display: grid;
      grid-template-columns: auto minmax(0, 1fr) auto;
      align-items: center;
      gap: 18px;
      min-height: 64px;
      padding: 10px clamp(16px, 3vw, 34px);
      border-bottom: 1px solid var(--line);
      background: color-mix(in srgb, var(--surface) 90%, transparent);
      backdrop-filter: blur(16px);
    }

    .brand {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      color: var(--ink);
      font-weight: 800;
      text-decoration: none;
      letter-spacing: 0;
    }

    .brand-mark {
      display: grid;
      width: 38px;
      height: 38px;
      place-items: center;
      border: 1px solid color-mix(in srgb, var(--accent) 45%, var(--line));
      border-radius: 8px;
      background: var(--accent);
      color: var(--accent-ink);
      font-family: var(--mono);
      font-size: 13px;
      font-weight: 700;
    }

    .topnav-links,
    .topnav-actions,
    .chip-row,
    .page-actions,
    .source-actions {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .topnav-links {
      min-width: 0;
    }

    .nav-link,
    .tab-link,
    .chip,
    .btn-secondary,
    .icon-btn {
      min-height: 34px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--surface);
      color: var(--muted);
      text-decoration: none;
      transition: background 140ms ease, color 140ms ease, border-color 140ms ease, transform 140ms ease;
    }

    .nav-link {
      padding: 8px 12px;
      font-size: 13px;
      font-weight: 650;
    }

    .nav-link:hover,
    .tab-link:hover,
    .chip:hover,
    .btn-secondary:hover,
    .icon-btn:hover {
      border-color: var(--line-strong);
      color: var(--ink);
      transform: translateY(-1px);
    }

    .nav-link-active,
    .tab-link-active,
    .chip-active {
      border-color: color-mix(in srgb, var(--accent) 42%, var(--line));
      background: color-mix(in srgb, var(--accent) 12%, var(--surface));
      color: var(--accent);
    }

    .icon-btn {
      display: inline-grid;
      width: 38px;
      height: 38px;
      place-items: center;
      padding: 0;
      font-weight: 700;
    }

    .user-chip {
      display: inline-flex;
      align-items: center;
      gap: 9px;
      min-height: 40px;
      padding: 5px 10px 5px 6px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--surface);
      color: var(--ink);
    }

    .user-avatar {
      display: grid;
      width: 28px;
      height: 28px;
      place-items: center;
      border-radius: 7px;
      background: color-mix(in srgb, var(--blue) 14%, var(--surface));
      color: var(--blue);
      font-weight: 800;
    }

    .user-chip span:last-child {
      display: grid;
      line-height: 1.1;
    }

    .user-chip small {
      color: var(--muted);
      font-size: 11px;
    }

    .shell {
      width: min(1480px, calc(100% - 32px));
      margin: 22px auto 80px;
    }

    .page-bar {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 18px;
      align-items: end;
      margin-bottom: 14px;
      padding: 18px 0 8px;
    }

    .page-bar h1 {
      margin: 0;
      font-size: clamp(27px, 4vw, 46px);
      line-height: 0.98;
      letter-spacing: 0;
    }

    .page-tagline {
      display: block;
      margin-top: 8px;
      color: var(--muted);
      font-size: 14px;
    }

    .client-tabs {
      position: sticky;
      top: 64px;
      z-index: 40;
      display: flex;
      gap: 8px;
      overflow-x: auto;
      margin: 0 -2px 16px;
      padding: 8px 2px 10px;
      background: color-mix(in srgb, var(--bg) 92%, transparent);
      backdrop-filter: blur(10px);
    }

    .tab-link {
      flex: 0 0 auto;
      padding: 8px 11px;
      font-size: 13px;
      font-weight: 700;
      white-space: nowrap;
    }

    .panel {
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: color-mix(in srgb, var(--surface) 96%, transparent);
      box-shadow: var(--shadow);
    }

    .panel + .panel {
      margin-top: 16px;
    }

    .panel-muted {
      background: color-mix(in srgb, var(--surface-2) 96%, transparent);
    }

    .panel-head {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 16px;
      padding: 18px 18px 12px;
      border-bottom: 1px solid var(--line);
    }

    .panel-head h2,
    .subsection-head h3,
    .product-head h3 {
      margin: 0;
      letter-spacing: 0;
    }

    .panel-head h2 {
      font-size: 19px;
      line-height: 1.2;
    }

    .panel-body {
      padding: 18px;
    }

    .meta {
      margin: 5px 0 0;
      color: var(--muted);
      font-size: 13px;
    }

    .eyebrow {
      display: inline-block;
      margin-bottom: 5px;
      color: var(--muted);
      font-family: var(--mono);
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
    }

    .mono {
      font-family: var(--mono);
      font-size: 0.94em;
    }

    .grid {
      display: grid;
      gap: 16px;
    }

    .grid-2 {
      grid-template-columns: repeat(2, minmax(0, 1fr));
    }

    .grid-3 {
      grid-template-columns: repeat(3, minmax(0, 1fr));
    }

    .workspace-grid {
      display: grid;
      grid-template-columns: minmax(270px, 340px) minmax(0, 1fr);
      gap: 16px;
      align-items: start;
    }

    .rail {
      position: sticky;
      top: 128px;
      display: grid;
      gap: 16px;
    }

    .module-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 12px;
    }

    .module-tile {
      min-height: 116px;
      padding: 15px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--surface);
      color: inherit;
      text-decoration: none;
      transition: border-color 140ms ease, transform 140ms ease, background 140ms ease;
    }

    .module-tile:hover {
      border-color: color-mix(in srgb, var(--accent) 38%, var(--line));
      transform: translateY(-2px);
    }

    .module-tile strong,
    .rowitem strong,
    .coverage-row strong {
      display: block;
      margin-bottom: 5px;
      font-size: 15px;
    }

    .module-tile span,
    .rowitem small {
      color: var(--muted);
      font-size: 13px;
    }

    .metric-stack,
    .summary-grid,
    .origin-source-strip,
    .origin-product-strip,
    .origin-method-grid {
      display: grid;
      gap: 10px;
    }

    .metric-stack {
      grid-template-columns: 1fr;
    }

    .summary-grid,
    .origin-source-strip {
      grid-template-columns: repeat(5, minmax(0, 1fr));
    }

    .origin-product-strip {
      grid-template-columns: repeat(7, minmax(0, 1fr));
      margin: 14px 0;
    }

    .origin-method-grid {
      grid-template-columns: repeat(3, minmax(0, 1fr));
      margin-bottom: 14px;
    }

    .metric-stack > div,
    .summary-grid > div,
    .origin-source-strip > div,
    .origin-product-strip > div,
    .origin-method-grid > div,
    .invoice-fact {
      min-width: 0;
      padding: 12px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--surface-2);
    }

    .metric-stack span,
    .summary-grid span,
    .origin-source-strip span,
    .origin-product-strip span,
    .origin-method-grid span,
    .invoice-fact span {
      display: block;
      margin-bottom: 4px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 650;
    }

    .metric-stack strong,
    .summary-grid strong,
    .origin-source-strip strong,
    .origin-product-strip strong,
    .origin-method-grid strong,
    .invoice-fact strong {
      display: block;
      min-width: 0;
      overflow-wrap: anywhere;
      font-size: 16px;
    }

    .origin-method-grid small {
      display: block;
      margin-top: 4px;
      color: var(--muted);
    }

    .btn,
    button[type="submit"] {
      min-height: 38px;
      padding: 9px 13px;
      border: 1px solid color-mix(in srgb, var(--accent) 65%, var(--line));
      border-radius: 8px;
      background: var(--accent);
      color: var(--accent-ink);
      font-weight: 780;
      transition: transform 140ms ease, filter 140ms ease;
    }

    .btn:hover,
    button[type="submit"]:hover {
      filter: brightness(1.03);
      transform: translateY(-1px);
    }

    .btn-secondary {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      min-width: fit-content;
      padding: 8px 12px;
      font-weight: 720;
    }

    .chip {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      min-width: fit-content;
      padding: 6px 10px;
      font-size: 12px;
      font-weight: 700;
      white-space: nowrap;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      min-height: 24px;
      padding: 4px 8px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: var(--surface);
      color: var(--muted);
      font-size: 12px;
      font-weight: 760;
      white-space: nowrap;
    }

    .badge::before {
      content: "";
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: currentColor;
    }

    .badge-success,
    .badge-ok {
      border-color: color-mix(in srgb, var(--accent) 35%, var(--line));
      background: color-mix(in srgb, var(--accent) 10%, var(--surface));
      color: var(--accent);
    }

    .badge-info {
      border-color: color-mix(in srgb, var(--blue) 35%, var(--line));
      background: color-mix(in srgb, var(--blue) 10%, var(--surface));
      color: var(--blue);
    }

    .badge-warning,
    .badge-warn {
      border-color: color-mix(in srgb, var(--amber) 35%, var(--line));
      background: color-mix(in srgb, var(--amber) 11%, var(--surface));
      color: var(--amber);
    }

    .badge-error,
    .badge-bad {
      border-color: color-mix(in srgb, var(--red) 35%, var(--line));
      background: color-mix(in srgb, var(--red) 10%, var(--surface));
      color: var(--red);
    }

    .callout {
      display: grid;
      grid-template-columns: 28px minmax(0, 1fr);
      gap: 11px;
      margin-bottom: 14px;
      padding: 13px;
      border: 1px solid color-mix(in srgb, var(--blue) 28%, var(--line));
      border-radius: var(--radius);
      background: color-mix(in srgb, var(--blue) 8%, var(--surface));
    }

    .callout-success {
      border-color: color-mix(in srgb, var(--accent) 30%, var(--line));
      background: color-mix(in srgb, var(--accent) 9%, var(--surface));
    }

    .callout-warning {
      border-color: color-mix(in srgb, var(--amber) 32%, var(--line));
      background: color-mix(in srgb, var(--amber) 10%, var(--surface));
    }

    .callout-icon {
      display: grid;
      width: 26px;
      height: 26px;
      place-items: center;
      border-radius: 7px;
      background: var(--surface);
      color: var(--blue);
      font-weight: 900;
    }

    .callout-title {
      margin-bottom: 3px;
      font-weight: 800;
    }

    .rowlist {
      display: grid;
      gap: 8px;
    }

    .rowitem,
    .coverage-row,
    .case-list-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      min-width: 0;
      padding: 12px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--surface);
    }

    .case-list-row {
      color: inherit;
      text-decoration: none;
    }

    .rowitem > div,
    .case-list-row > span {
      min-width: 0;
    }

    .workflow-stepper {
      display: grid;
      grid-template-columns: repeat(6, minmax(0, 1fr));
      gap: 8px;
    }

    .workflow-step {
      min-width: 0;
      padding: 11px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--surface);
      color: var(--muted);
      text-align: left;
      transition: transform 140ms ease, border-color 140ms ease, background 140ms ease;
    }

    .workflow-step:hover {
      transform: translateY(-1px);
      color: var(--ink);
    }

    .workflow-step-active {
      border-color: color-mix(in srgb, var(--accent) 45%, var(--line));
      background: color-mix(in srgb, var(--accent) 10%, var(--surface));
      color: var(--accent);
    }

    .workflow-step strong,
    .workflow-step span,
    .workflow-step em {
      display: block;
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .workflow-step span {
      font-family: var(--mono);
      font-size: 11px;
      font-weight: 800;
    }

    .workflow-step strong {
      margin-top: 4px;
      color: inherit;
      font-size: 14px;
    }

    .workflow-step em {
      margin-top: 4px;
      color: var(--muted);
      font-size: 11px;
      font-style: normal;
    }

    .stack-form,
    .form-grid {
      display: grid;
      gap: 12px;
    }

    .form-grid {
      grid-template-columns: repeat(2, minmax(0, 1fr));
    }

    label {
      display: grid;
      gap: 6px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 750;
    }

    input,
    select,
    textarea {
      width: 100%;
      min-height: 38px;
      padding: 8px 10px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--surface);
      color: var(--ink);
      outline: none;
    }

    textarea {
      min-height: 84px;
      resize: vertical;
    }

    input:focus,
    select:focus,
    textarea:focus {
      border-color: color-mix(in srgb, var(--accent) 45%, var(--line));
      box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 12%, transparent);
    }

    .inline-check {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .inline-check input {
      width: 16px;
      min-height: 16px;
    }

    .table-toolbar {
      display: grid;
      grid-template-columns: minmax(220px, 1fr) auto auto;
      gap: 10px;
      align-items: end;
      margin-bottom: 12px;
    }

    .table-meta-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 10px;
    }

    .table-scroll {
      overflow: auto;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--surface);
    }

    table {
      width: 100%;
      border-collapse: collapse;
      min-width: 860px;
    }

    th,
    td {
      padding: 10px 12px;
      border-bottom: 1px solid var(--line);
      text-align: left;
      vertical-align: top;
    }

    th {
      position: sticky;
      top: 0;
      z-index: 2;
      background: var(--surface-2);
      color: var(--muted);
      font-size: 12px;
      font-weight: 780;
    }

    tr:last-child td {
      border-bottom: 0;
    }

    tbody tr:hover {
      background: color-mix(in srgb, var(--accent) 5%, transparent);
    }

    td.num,
    th.num {
      text-align: right;
      font-variant-numeric: tabular-nums;
    }

    .empty-cell {
      padding: 22px;
      color: var(--muted);
      text-align: center;
    }

    .product-stack {
      display: grid;
      gap: 16px;
    }

    .product-block {
      padding: 15px;
      border: 1px solid var(--line);
      border-left: 4px solid var(--accent);
      border-radius: var(--radius);
      background: var(--surface);
    }

    .product-head {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto minmax(180px, 260px);
      gap: 12px;
      align-items: start;
    }

    .product-head p {
      margin: 4px 0 0;
      color: var(--muted);
    }

    .product-bom-picker {
      min-width: 180px;
    }

    .warning-list {
      display: grid;
      gap: 7px;
      margin: 12px 0;
    }

    .warning-list div {
      padding: 8px 10px;
      border: 1px solid color-mix(in srgb, var(--amber) 28%, var(--line));
      border-radius: 8px;
      background: color-mix(in srgb, var(--amber) 10%, var(--surface));
      color: var(--amber);
      font-size: 13px;
      font-weight: 650;
    }

    .invoice-preview {
      display: grid;
      gap: 10px;
      margin-top: 10px;
    }

    .invoice-preview-summary {
      padding: 12px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--surface-2);
    }

    .invoice-preview-head,
    .invoice-facts,
    .invoice-form-hints {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      flex-wrap: wrap;
    }

    .invoice-facts {
      margin-top: 10px;
    }

    .invoice-facts span {
      padding: 6px 8px;
      border: 1px solid var(--line);
      border-radius: 8px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 700;
    }

    .invoice-market-hint {
      margin-top: 10px;
      padding: 10px;
      border: 1px solid color-mix(in srgb, var(--accent) 25%, var(--line));
      border-radius: var(--radius);
      background: color-mix(in srgb, var(--accent) 8%, var(--surface));
    }

    .invoice-market-hint span,
    .invoice-form-hints span {
      display: block;
      color: var(--muted);
      font-size: 12px;
      font-weight: 720;
    }

    .invoice-market-hint p {
      margin: 5px 0 10px;
      color: var(--muted);
    }

    .invoice-form-hints {
      margin-top: 10px;
    }

    .invoice-form-hints div {
      flex: 1 1 180px;
      padding: 10px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--surface);
    }

    .market-option-grid,
    .form-lane-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 10px;
    }

    .market-option,
    .form-lane {
      min-height: 92px;
      padding: 12px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--surface);
      text-align: left;
    }

    .market-option-active,
    .form-lane-recommended {
      border-color: color-mix(in srgb, var(--accent) 40%, var(--line));
      background: color-mix(in srgb, var(--accent) 9%, var(--surface));
    }

    .activity-log {
      max-height: 310px;
      overflow: auto;
    }

    .settings-tabs {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-bottom: 14px;
    }

    .settings-tab {
      padding: 8px 12px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--surface);
      color: var(--muted);
      font-weight: 750;
    }

    .settings-tab-active {
      border-color: color-mix(in srgb, var(--accent) 42%, var(--line));
      background: color-mix(in srgb, var(--accent) 11%, var(--surface));

    function esc(value) {
      return String(value ?? "").replace(/[&<>"']/g, (char) => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        "\"": "&quot;",
        "'": "&#39;",
      }[char]));
    }

    function number(value) {
      const numeric = Number(value || 0);
      return fmtNumber.format(numeric);
    }

    function quantity(value) {
      return fmtQty.format(Number(value || 0));
    }

    function badge(label, type = "neutral") {

    }

    function getVariant(product) {
      return product.variants.find((variant) => variant.id === product.bomVersion) || product.variants[0];
    }

    function calculateProduct(product) {
      const variant = getVariant(product);
      const materials = variant.materials;
      const vnm = materials.reduce((sum, material) => material.origin === "non_origin" ? sum + Number(material.value || 0) : sum, 0);
      const missing = materials.filter((material) => material.origin === "non_origin" && !Number(material.value || 0));
      const rvc = product.fob ? ((Number(product.fob) - vnm) / Number(product.fob)) * 100 : 0;
      const passed = rvc >= Number(product.threshold || 0) && missing.length === 0;
      const warnings = [];
      if (missing.length) warnings.push(`Thiếu đơn giá NVL: ${missing.map((row) => row.code).join(", ")}`);
      if (variant.status !== "published") warnings.push(`BOM TP ${variant.label} đang cần review trước khi dùng cho hồ sơ thật.`);
      return { variant, materials, vnm, rvc, passed, missing, warnings };
    }

    function totals() {
      const calcs = products.map(calculateProduct);
      const passed = calcs.filter((calc) => calc.passed).length;
      const minRvc = Math.min(...calcs.map((calc) => calc.rvc));
      const readyDocs = state.documents.filter((doc) => doc.status === "ready").length;
      const warningCount = calcs.reduce((sum, calc) => sum + calc.warnings.length, 0);
      return { calcs, passed, minRvc, readyDocs, warningCount };
    }

    function invoiceMatches() {
      return bcctRows.filter((row) => row.direction === "Xuất khẩu" && row.invoice_ref === state.case.invoiceNo);
    }

    function marketPreset(value = state.case.market) {
      const normalized = normalize(value);
      return marketPresets.find((preset) => {
        const haystack = normalize(`${preset.market} ${preset.label} ${preset.aliases}`);
        return haystack.includes(normalized) || normalized.includes(normalize(preset.market));
      }) || marketPresets[0];
    }

    function normalize(value) {
      return String(value || "")
        .toLowerCase()
        .normalize("NFD")
        .replace(/[\u0300-\u036f]/g, "")
        .replace(/đ/g, "d")
        .replace(/[^a-z0-9]+/g, " ")
        .trim();
    }

    function filterRows(rows, query, keys) {
      const needle = normalize(query);
      if (!needle) return rows;
      return rows.filter((row) => normalize(keys.map((key) => row[key]).join(" ")).includes(needle));
    }

      return {
        key: active.dataset.focusKey,
        start: active.selectionStart,
        end: active.selectionEnd,
      };
    }

    function restoreFocus(focus) {
      if (!focus) return;
      requestAnimationFrame(() => {
        const next = document.querySelector(`[data-focus-key="${CSS.escape(focus.key)}"]`);
        if (!next) return;
        next.focus();
        if (typeof next.setSelectionRange === "function" && focus.start !== null) {
          next.setSelectionRange(focus.start, focus.end);
        }
      });
    }

    function toast(message) {
      state.activity.unshift(message);
      const area = document.getElementById("toastArea");
      const node = document.createElement("div");
      node.className = "toast";
      node.textContent = message;
      area.appendChild(node);
      setTimeout(() => node.remove(), 3200);
    }

    function applyMarket(value) {
      const preset = marketPreset(value);
      state.case.market = preset.market;
      state.case.form = preset.form;
      state.case.agreement = preset.agreement;
      state.case.instrument = preset.instrument;
      state.case.rule = preset.rule;
      toast(`Đã áp dụng ${preset.label}.`);
      render();
    }

    function findMaterial(payload) {
      const [productCode, materialCode] = payload.split("|");
      const product = products.find((item) => item.code === productCode);
      const variant = product ? getVariant(product) : null;
      const material = variant ? variant.materials.find((item) => item.code === materialCode) : null;
      return { product, material };
    }

    function exportSnapshot() {
      const rows = [
        ["Case", state.case.caseCode, state.case.invoiceNo, state.case.market, state.case.form],
        ["Product", "HS", "FOB", "VNM", "RVC", "Status"],
        ...products.map((product) => {
          const calc = calculateProduct(product);
          return [product.code, product.hs, product.fob, calc.vnm, `${number(calc.rvc)}%`, calc.passed ? "Dat" : "Can soat"];
        }),
        [],
        ["Material", "Product", "HS", "Origin", "Value", "Valuation"],
        ...products.flatMap((product) => calculateProduct(product).materials.map((material) => [material.code, product.code, material.hs, material.origin, material.value, material.valuation])),
      ];
      const csv = rows.map((row) => row.map((cell) => `"${String(cell ?? "").replace(/"/g, '""')}"`).join(",")).join("\n");
      const blob = new Blob([csv], { type: "text/csv;charset=utf-8" });
      const url = URL.createObjectURL(blob);
      const link = document.createElement("a");
      link.href = url;
      link.download = `${state.case.caseCode}-origin-snapshot-demo.csv`;
      document.body.appendChild(link);
      link.click();
      link.remove();
      URL.revokeObjectURL(url);
      toast("Demo đã xuất Origin Snapshot CSV từ dữ liệu đang hiển thị.");
    }

    document.addEventListener("click", (event) => {
      const viewButton = event.target.closest("[data-view]");
      if (viewButton) {
        event.preventDefault();
        state.view = viewButton.dataset.view;
        if (viewButton.dataset.nextCaseStep) state.caseStep = viewButton.dataset.nextCaseStep;
        render();
        return;
      }

      const stepButton = event.target.closest("[data-case-step]");
      if (stepButton) {
        state.caseStep = stepButton.dataset.caseStep;
        render();
        return;
      }

      const action = event.target.closest("[data-action]");
      if (!action) return;
      event.preventDefault();
      const name = action.dataset.action;
      if (name === "toggle-theme") {
        state.theme = state.theme === "light" ? "dark" : "light";
        render();
      } else if (name === "clear-filter") {
        state.filters[action.dataset.filterClear] = "";
        render();
      } else if (name === "catalog-kind") {
        state.catalogKind = action.dataset.kind;
        render();
      } else if (name === "select-bom-product") {
        state.selectedBomProduct = action.dataset.code;
        render();
      } else if (name === "bcct-direction") {
        state.bcctDirection = action.dataset.direction;
        render();
      } else if (name === "apply-market") {
        applyMarket(action.dataset.market);
      } else if (name === "lookup-invoice") {
        toast(invoiceMatches().length ? `Tìm thấy ${invoiceMatches().length} dòng BCCT xuất khẩu.` : "Chưa thấy dòng BCCT khớp invoice.");
        render();
      } else if (name === "save-shipment") {
        applyMarket(state.case.market);
        toast("Đã lưu thông tin lô hàng trong demo.");
      } else if (name === "add-document") {
        const slot = document.getElementById("docSlot")?.value || "Khác";
        const file = document.getElementById("docName")?.value || "supporting-file.pdf";
        state.documents.push({ slot, label: slot, reference: file, status: "ready" });
        toast(`Đã thêm chứng từ ${file}.`);
        render();
      } else if (name === "toggle-doc") {
        const doc = state.documents.find((item) => item.reference === action.dataset.docRef);
        if (doc) doc.status = doc.status === "ready" ? "pending" : "ready";
        render();
      } else if (name === "recalc-origin") {
        toast("Đã tính lại snapshot xuất xứ từ dữ liệu đang hiển thị.");
        render();
      } else if (name === "export-dossier") {
        exportSnapshot();
      } else if (name === "refresh-fx") {
        state.fxRefreshedAt = new Date().toLocaleString("vi-VN");
        toast("Đã refresh tỷ giá mô phỏng.");
        render();
      } else if (name === "save-config") {
        state.clientConfigHash = Math.random().toString(16).slice(2, 10);
        toast("Đã lưu cấu hình công ty trong demo.");
        render();
      } else if (name === "form-tab") {
        state.formTab = action.dataset.formTab;
        render();
      } else if (name === "save-form-index") {
        toast("Đã lưu C/O Form Index trong demo.");
      } else if (name === "mock-upload") {
        toast("Demo đã ghi nhận thao tác upload/so sánh.");
      }
    });

    document.addEventListener("input", (event) => {
      const target = event.target;
      if (target.dataset.filterKey) {
        state.filters[target.dataset.filterKey] = target.value;
        render();
        return;
      }
      if (target.dataset.caseField) {
        state.case[target.dataset.caseField] = target.value;
      }
    });

    document.addEventListener("change", (event) => {
      const target = event.target;
      if (target.dataset.productVersion) {
        const product = products.find((item) => item.code === target.dataset.productVersion);
        if (product) product.bomVersion = target.value;
        toast(`Đã đổi BOM TP ${target.dataset.productVersion}.`);
        render();
        return;
      }
      if (target.dataset.productFob) {
        const product = products.find((item) => item.code === target.dataset.productFob);
        if (product) product.fob = Number(target.value || 0);
        render();
        return;
      }
      if (target.dataset.materialValue) {
        const found = findMaterial(target.dataset.materialValue);
        if (found.material) found.material.value = Number(target.value || 0);
        render();
        return;
      }
      if (target.dataset.materialConsumed) {
        const found = findMaterial(target.dataset.materialConsumed);
        if (found.material) found.material.consumed = Number(target.value || 0);
        render();
        return;
      }
      if (target.dataset.materialOrigin) {
        const found = findMaterial(target.dataset.materialOrigin);
        if (found.material) found.material.origin = target.value;
        render();
        return;
      }
      if (target.dataset.formToggle) {
        const form = formRows.find((row) => row.code === target.dataset.formToggle);
        if (form) form.enabled = target.checked;
        render();
      }
    });

    document.addEventListener("submit", (event) => {
      event.preventDefault();
    });

    render();
  </script>
</body>
</html>
