services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-co}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-barry_co}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./data/seed:/seed:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-co} -d ${POSTGRES_DB:-barry_co}"]
      interval: 5s
      timeout: 3s
      retries: 20

  app:
    build:
      context: .
      args:
        VERSION: ${CO_VERSION:-0.0.0}
        GIT_SHA: ${CO_GIT_SHA:-unknown}
        BUILD_TIME: ${CO_BUILD_TIME:-unknown}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      BARRY_DATABASE_URL: postgresql://${POSTGRES_USER:-co}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-barry_co}
      BARRY_DATABASE_SCHEMA: ${BARRY_DATABASE_SCHEMA:-co}
      DATA_HUB_CONFIG_PATH: /var/lib/barry-co/runtime/data-hub-link.json
      DATA_HUB_ENABLED: ${DATA_HUB_ENABLED:-1}
      CO_AUTH_REQUIRED: ${CO_AUTH_REQUIRED:-1}
      DATA_HUB_BASE_URL: ${DATA_HUB_BASE_URL:?DATA_HUB_BASE_URL is required}
      DATA_HUB_API_BASE_URL: ${DATA_HUB_API_BASE_URL:?DATA_HUB_API_BASE_URL is required}
      DATA_HUB_ISSUER_URL: ${DATA_HUB_ISSUER_URL:?DATA_HUB_ISSUER_URL is required}
      DATA_HUB_JWKS_URL: ${DATA_HUB_JWKS_URL:?DATA_HUB_JWKS_URL is required}
      DATA_HUB_API_TOKEN: ${DATA_HUB_API_TOKEN:-}
      DATA_HUB_REQUEST_TIMEOUT_SECONDS: ${DATA_HUB_REQUEST_TIMEOUT_SECONDS:-20}
      DATA_HUB_CLIENT_CLAIM_KEYS: ${DATA_HUB_CLIENT_CLAIM_KEYS:-client_ids,clients,allowed_clients,visible_clients,dncx_ids,client_id,dncx_id}
      DATA_HUB_ADMIN_ROLES: ${DATA_HUB_ADMIN_ROLES:-dev,admin}
      CO_PUBLIC_BASE_URL: ${CO_PUBLIC_BASE_URL:?CO_PUBLIC_BASE_URL is required}
      CO_FORCE_HTTPS_COOKIE: ${CO_FORCE_HTTPS_COOKIE:-0}
      CO_FORM_CONFIG_PATH: /var/lib/barry-co/runtime/co-form-index.json
      CLIENT_CONFIG_ROOT: /var/lib/barry-co/client-config
      SOURCE_STORE_ROOT: /var/lib/barry-co/source-modules
      BOM_STORE_ROOT: /var/lib/barry-co/bom-builder
      CO_CASE_STORE_ROOT: /var/lib/barry-co/co-cases
      CUSTOMS_FX_STORE_ROOT: /var/lib/barry-co/customs-fx
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      LLM_MODEL: ${LLM_MODEL:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_TEMPERATURE: ${LLM_TEMPERATURE:-0.0}
      LLM_TIMEOUT_S: ${LLM_TIMEOUT_S:-30}
      LLM_MAX_RETRIES: ${LLM_MAX_RETRIES:-2}
      LLM_MAX_CALLS_PER_DAY_PER_CLIENT: ${LLM_MAX_CALLS_PER_DAY_PER_CLIENT:-50}
    ports:
      - "${APP_BIND:-0.0.0.0}:${APP_PORT:-8755}:8755"
    volumes:
      - appdata:/var/lib/barry-co
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8755/healthz"]
      interval: 10s
      timeout: 3s
      retries: 12
    networks:
      # default: reach this project's `db`. tinsu-shared: reach Data Hub's
      # API by its internal alias `data-hub-app:8754` (set
      # DATA_HUB_API_BASE_URL=http://data-hub-app:8754) instead of the public
      # domain. Keep DATA_HUB_ISSUER_URL/JWKS/BASE_URL on the public URL —
      # CO decouples call-URL from issuer and verifies a multi-issuer tuple.
      default: {}
      tinsu-shared: {}

volumes:
  pgdata:
  appdata:

networks:
  # Cross-project bridge shared with the Data Hub compose project. Created out
  # of band (`docker network create tinsu-shared`); external so neither
  # project owns/destroys it.
  tinsu-shared:
    external: true
