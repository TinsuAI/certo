<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Barry CO Demo{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/css/app.css">
</head>
<body data-theme="{{ theme }}">
  <div class="shell-noise"></div>
  <header class="topnav">
    <a class="brand" href="/">
      <span class="brand-mark">CO</span>
      <span>Barry CO</span>
    </a>
    <nav class="topnav-links" aria-label="Điều hướng">
      <a href="/clients">Công ty</a>
      <a href="/portfolio">Portfolio</a>
    </nav>
    <form method="post" action="/settings/theme" class="topnav-toggle-form">
      <input type="hidden" name="theme" value="{{ next_theme }}">
      <input type="hidden" name="next_url" value="{{ request.url.path }}">
      <button type="submit"
              class="topnav-chip topnav-chip-button"
              title="Giao diện - {{ 'Sáng' if next_theme == 'light' else 'Tối' }}"
              aria-label="Đổi giao diện sáng tối">
        {% if theme == "dark" %}
        <svg class="topnav-chip-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"
             fill="none" stroke="currentColor" stroke-width="1.7"
             stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
        </svg>
        {% else %}
        <svg class="topnav-chip-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"
             fill="none" stroke="currentColor" stroke-width="1.7"
             stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="12" cy="12" r="4"/>
          <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/>
        </svg>
        {% endif %}
      </button>
    </form>
  </header>
  <main class="shell">
    {% block content %}{% endblock %}
  </main>
</body>
</html>
