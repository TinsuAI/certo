{% extends "base.html" %}
{% block title %}{{ t('bom.upload_title') }} · {{ client.name }}{% endblock %}
{% block content %}
{% include "_client_nav.html" %}

<section class="zone">
  <div class="zone-head">
    <div>
      <h2>{{ t('bom.upload_title') }}</h2>
      <p class="meta">{{ t('bom.upload_help') }}</p>
    </div>
    <div><a class="btn-secondary" href="/clients/{{ client.client_id }}/bom">{{ t('common.cancel') }}</a></div>
  </div>
  <form method="post" action="/clients/{{ client.client_id }}/bom/upload"
        enctype="multipart/form-data" class="zone mini-panel" style="max-width: 700px;">
    <label class="field">
      <span class="field-label">{{ t('bom.upload_profile') }}</span>
      <select name="profile">
        <option value="auto" selected>Tự động phát hiện (recommended)</option>
        {% for p in profiles %}
        <option value="{{ p }}">{{ t('bom.adapter.' ~ p ~ '.label') }} ({{ p }})</option>
        {% endfor %}
      </select>
      <p class="meta" style="font-size:.85em; color:#888; margin-top:.3em;">
        Mặc định <strong>Tự động</strong> — hệ thống thử lần lượt 5 parser
        và chọn cái phù hợp. Chọn parser cụ thể nếu auto chọn sai.
      </p>
    </label>
    <div class="upload-zone">
      <input type="file" name="file" accept=".xlsx,.xls" required>
      <p class="meta">{{ t('bom.upload_profile_help') }}</p>
    </div>
    <button type="submit" class="btn-primary">{{ t('common.upload_btn') }}</button>
  </form>
</section>
{% endblock %}
