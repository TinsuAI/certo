{# Reusable per-page metric band. `cards` = list of dicts:
   {value, label, sub?, tone?}  tone ∈ primary|warn|bad. #}
{% macro metric_dash(cards) %}
{% if cards %}
<div class="data-dash">
  {% for c in cards %}
  <div class="data-dash-card {% if c.tone %}is-{{ c.tone }}{% endif %}">
    <span class="ddc-label">{{ c.label }}</span>
    <span class="ddc-value">{{ c.value }}</span>
    {% if c.sub %}<span class="ddc-sub">{{ c.sub }}</span>{% endif %}
  </div>
  {% endfor %}
</div>
{% endif %}
{% endmacro %}
