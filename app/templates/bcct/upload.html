{% extends "base.html" %}
{% block title %}Upload BCCT · Data Hub{% endblock %}
{% block content %}
<div class="page-header"><h1>Upload BCCT</h1></div>
<form method="post" action="/bcct/upload" enctype="multipart/form-data" class="auth-form" style="max-width: 600px;">
  <label class="field"><span class="field-label">DNCX</span>
    <select name="dncx_id">{% for d in dncxs %}<option value="{{ d.dncx_id }}" {% if d.dncx_id == dncx_id %}selected{% endif %}>{{ d.name }}</option>{% endfor %}</select>
  </label>
  <label class="field"><span class="field-label">Năm</span>
    <input type="number" name="year" min="2020" max="2099" required value="2025">
  </label>
  <div class="upload-zone">
    <input type="file" name="file" accept=".xlsx,.xls" required>
    <p>File BCCT chuẩn (xuất từ VNACCS hoặc từ ERP). Internal code sẽ tự parse từ "Tên hàng" theo cấu hình DNCX.</p>
  </div>
  <button type="submit" class="btn btn-primary">Upload & Parse</button>
</form>
{% endblock %}
